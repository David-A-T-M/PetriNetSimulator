name: Java CI with Gradle

on:
  push:
    branches: [ 'feat/**'  ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Check (Linter + Formatter + Tests)
        run: ./gradlew check --no-daemon --stacktrace --info

      - name: Print test failure summary
        if: failure()
        run: |
          echo "=== JUnit XML failures (if any) ==="
          if [ -d build/test-results/test ]; then
            grep -R --line-number "<failure\|<error" build/test-results/test || true
          else
            echo "No test results directory found."
          fi

      - name: Upload test and report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-check-artifacts
          path: |
            build/test-results/**
            build/reports/tests/**
            build/reports/checkstyle/**
            build/reports/spotless/**
          if-no-files-found: warn